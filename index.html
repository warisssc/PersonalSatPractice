<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAT Systems | Prep Database</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Montserrat', 'sans-serif'],
          },
          colors: {
            brand: '#DE3B34',
            brandDark: '#A82520',
            surface: {
              light: '#F8F9FA',
              dark: '#121212',
            },
            text: {
              main: '#1A1A1A',
              dark: '#FFFFFF',
              muted: '#6B7280',
              mutedDark: '#9CA3AF'
            },
            correct: '#10B981',
            incorrect: '#DE3B34'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Base theme & smooth transitions */
    :root { color-scheme: light; }
    html.dark { color-scheme: dark; }
    
    body {
      transition: background-color 0.4s ease, color 0.4s ease;
      background-color: theme('colors.surface.light');
      color: theme('colors.text.main');
      -webkit-tap-highlight-color: transparent; /* Removes default mobile tap highlight */
    }
    
    html.dark body {
      background-color: theme('colors.surface.dark');
      color: theme('colors.text.dark');
    }

    /* Background Geometric Rings */
    .bg-rings {
      position: absolute;
      top: -5%;
      right: -20%;
      width: 500px;
      height: 500px;
      background-image: radial-gradient(circle, transparent 40%, rgba(222, 59, 52, 0.05) 41%, rgba(222, 59, 52, 0.05) 45%, transparent 46%, transparent 55%, rgba(222, 59, 52, 0.05) 56%, rgba(222, 59, 52, 0.05) 60%, transparent 61%);
      z-index: 0;
      pointer-events: none;
    }
    @media (min-width: 768px) {
      .bg-rings { width: 700px; height: 700px; right: -5%; top: -10%; }
    }
    html.dark .bg-rings {
      background-image: radial-gradient(circle, transparent 40%, rgba(222, 59, 52, 0.15) 41%, rgba(222, 59, 52, 0.15) 45%, transparent 46%, transparent 55%, rgba(222, 59, 52, 0.15) 56%, rgba(222, 59, 52, 0.15) 60%, transparent 61%);
    }

    /* =========================================================
       DUOLINGO-STYLE 3D BOUNCE PHYSICS
    ========================================================= */
    .tile-bouncy {
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 5px 0 0 var(--shadow-color, rgba(0,0,0,0.15));
    }
    html.dark .tile-bouncy {
      --shadow-color: rgba(255,255,255,0.15);
    }
    .tile-bouncy:active {
      transform: translateY(5px);
      box-shadow: 0 0px 0 0 var(--shadow-color, rgba(0,0,0,0.15));
    }
    
    /* Specific shadow overrides */
    .shadow-brand-3d { --shadow-color: theme('colors.brandDark') !important; }
    .shadow-correct-3d { --shadow-color: #047857 !important; }
    .shadow-incorrect-3d { --shadow-color: #991B1B !important; }
    .shadow-light-3d { --shadow-color: rgba(0,0,0,0.05) !important; }
    html.dark .shadow-light-3d { --shadow-color: rgba(255,255,255,0.05) !important; }

    /* Buttons */
    .btn-solid { background-color: theme('colors.brand'); color: white; }
    .btn-outline {
      border: 2px solid theme('colors.text.main');
      background-color: transparent;
      --shadow-color: theme('colors.text.main') !important;
    }
    html.dark .btn-outline {
      border-color: theme('colors.text.dark');
      --shadow-color: theme('colors.text.dark') !important;
    }
    
    /* Cutscene Animation */
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .animate-pulse-logo { animation: pulse-logo 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- ==========================================
       SPLASH SCREEN CUTSCENE
  =========================================== -->
  <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-surface-light dark:bg-surface-dark transition-opacity duration-500 ease-out">
    <div class="relative w-16 h-16 flex items-center justify-center mb-6 animate-pulse-logo">
      <div class="absolute w-16 h-16 rounded-full border-8 border-brand opacity-40 -ml-4"></div>
      <div class="absolute w-12 h-12 rounded-full bg-brand"></div>
    </div>
    <h1 class="font-display font-black text-3xl tracking-tight text-text-main dark:text-text-dark">SAT <span class="text-brand">Systems</span></h1>
  </div>

  <div class="bg-rings"></div>

  <!-- ==========================================
       TOP NAVIGATION & STATS DASHBOARD
  =========================================== -->
  <header id="main-header" class="w-full border-b border-black/10 dark:border-white/10 z-10 relative bg-surface-light/80 dark:bg-surface-dark/80 backdrop-blur-md opacity-0 transition-opacity duration-700">
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 md:py-4 flex flex-col md:flex-row items-center justify-between gap-3 md:gap-4">
      
      <div class="flex items-center justify-between w-full md:w-auto">
        <div class="flex items-center gap-2 md:gap-3 cursor-pointer tile-bouncy shadow-light-3d rounded-xl p-1 pr-3" onclick="navigate('home')">
          <div class="relative w-6 h-6 md:w-8 md:h-8 flex items-center justify-center">
            <div class="absolute w-6 h-6 md:w-8 md:h-8 rounded-full border-[3px] border-brand opacity-40 -ml-1 md:-ml-2"></div>
            <div class="absolute w-4 h-4 md:w-6 md:h-6 rounded-full bg-brand"></div>
          </div>
          <span class="font-display font-black text-lg md:text-xl tracking-tight">SAT<span class="text-brand hidden md:inline"> Sys</span></span>
        </div>

        <button id="theme-toggle" class="md:hidden p-2 rounded-full border-2 border-black/10 dark:border-white/10 tile-bouncy shadow-light-3d text-text-muted">
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        </button>
      </div>

      <nav class="flex w-full md:w-auto items-center justify-between md:justify-center gap-3 md:gap-6 text-xs md:text-sm font-semibold bg-black/5 dark:bg-white/5 md:bg-transparent rounded-xl p-2 md:p-0">
        <div class="flex items-center gap-1.5 md:gap-2">
          <span class="text-text-muted uppercase text-[10px] md:text-xs tracking-wider">Acc</span>
          <span id="nav-acc" class="text-brand font-black text-base md:text-lg">0%</span>
        </div>
        <div class="h-4 w-px bg-black/10 dark:bg-white/10"></div>
        <div class="flex items-center gap-1.5 md:gap-2">
          <span class="text-text-muted uppercase text-[10px] md:text-xs tracking-wider">Right</span>
          <span id="nav-right" class="text-correct font-black text-base md:text-lg">0</span>
        </div>
        <div class="h-4 w-px bg-black/10 dark:bg-white/10"></div>
        <div class="flex items-center gap-1.5 md:gap-2">
          <span class="text-text-muted uppercase text-[10px] md:text-xs tracking-wider">Wrong</span>
          <span id="nav-wrong" class="text-incorrect font-black text-base md:text-lg">0</span>
        </div>
        
        <div class="h-6 w-px bg-black/20 dark:bg-white/20 hidden md:block mx-2"></div>
        
        <button onclick="resetStats()" class="hidden md:block text-text-muted hover:text-brand transition-colors text-xs uppercase tracking-wider tile-bouncy shadow-light-3d px-3 py-1.5 rounded-lg border border-black/10 dark:border-white/10">Reset</button>
        
        <button id="theme-toggle-desktop" class="hidden md:block p-2 rounded-xl border border-black/10 dark:border-white/10 tile-bouncy shadow-light-3d text-text-muted">
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        </button>
      </nav>

    </div>
  </header>

  <!-- ==========================================
       MAIN CONTENT
  =========================================== -->
  <main id="main-content" class="flex-1 w-full max-w-7xl mx-auto px-4 md:px-6 py-8 md:py-12 z-10 relative opacity-0 transition-opacity duration-700 delay-150">
    
    <!-- VIEW: HOME -->
    <div id="view-home" class="grid grid-cols-1 lg:grid-cols-2 gap-10 md:gap-16 items-center pb-12">
      
      <div class="text-center md:text-left mt-4 md:mt-0">
        <h1 class="font-display font-black text-4xl sm:text-5xl md:text-6xl lg:text-7xl leading-[1.05] tracking-tighter uppercase mb-4 md:mb-6">
          Turn<br class="hidden md:block">
          <span class="text-brand">Testing</span> Weaknesses<br>
          Into <span class="text-brand">Mastery</span>
        </h1>
        <p class="text-text-muted dark:text-text-mutedDark text-base md:text-lg max-w-md mx-auto md:mx-0 mb-8 leading-relaxed">
          Access our scalable 4,000+ question database. Click a module to begin generating dynamic prep sets.
        </p>
        <div class="flex flex-col sm:flex-row justify-center md:justify-start gap-4">
          <button onclick="document.getElementById('module-grid').scrollIntoView({behavior: 'smooth'})" class="btn-solid tile-bouncy shadow-brand-3d px-8 py-4 rounded-xl font-bold text-lg w-full sm:w-auto">
            Start Practicing
          </button>
        </div>
      </div>

      <div id="module-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-5 scroll-mt-24">
        <!-- Categories injected via JS -->
      </div>
      
    </div>

    <!-- VIEW: QUIZ -->
    <div id="view-quiz" class="hidden max-w-3xl mx-auto pb-12">
      
      <div class="flex justify-between items-center mb-8 pb-4 border-b border-black/10 dark:border-white/10">
        <button onclick="navigate('home')" class="font-bold text-text-muted text-sm hover:text-brand transition-colors flex items-center gap-2 tile-bouncy shadow-light-3d px-3 py-2 rounded-lg border border-black/10 dark:border-white/10">
          <i data-lucide="x" class="w-4 h-4"></i> Exit
        </button>
        <div class="bg-surface-light dark:bg-surface-dark border-2 border-black/10 dark:border-white/10 px-4 py-2 rounded-xl font-bold text-sm tracking-widest tile-bouncy shadow-light-3d">
          <span id="q-counter">0 / 0</span>
        </div>
      </div>

      <div>
        <span id="q-module" class="text-xs font-black text-brand uppercase tracking-widest mb-4 block">Module Name</span>
        <p id="q-text" class="text-base md:text-lg leading-relaxed mb-6 text-text-muted dark:text-text-mutedDark"></p>
        <p id="q-prompt" class="font-display font-black text-xl md:text-2xl mb-8"></p>
        
        <div id="q-options" class="flex flex-col gap-4">
          <!-- Options injected by JS -->
        </div>
      </div>
    </div>

    <!-- VIEW: RESULTS / REVIEW -->
    <div id="view-results" class="hidden max-w-4xl mx-auto pb-12">
      <div class="mb-10 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-6">
        <div>
          <h2 class="font-display font-black text-3xl md:text-4xl tracking-tighter uppercase mb-2">Practice Complete</h2>
          <p class="text-text-muted dark:text-text-mutedDark text-sm md:text-base">Tap any question below to review your answers.</p>
        </div>
        <button onclick="navigate('home')" class="btn-solid tile-bouncy shadow-brand-3d px-8 py-4 rounded-xl font-bold w-full md:w-auto">
          Return to Modules
        </button>
      </div>

      <div id="review-list" class="flex flex-col gap-4">
        <!-- Review items injected by JS -->
      </div>
    </div>

  </main>

  <script>
    /* =========================================================
       INITIALIZATION & CUTSCENE
    ========================================================= */
    document.addEventListener("DOMContentLoaded", () => {
      // Simulate loading cutscene
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        
        setTimeout(() => {
          splash.style.display = 'none';
          document.getElementById('main-header').classList.remove('opacity-0');
          document.getElementById('main-content').classList.remove('opacity-0');
        }, 500); // Wait for fade out
      }, 1200); // Duration of splash
    });

    /* =========================================================
       THEME MANAGEMENT
    ========================================================= */
    const setupThemeToggle = (btnId) => {
      const btn = document.getElementById(btnId);
      if(!btn) return;
      btn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      });
    };

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    setupThemeToggle('theme-toggle');
    setupThemeToggle('theme-toggle-desktop');

    /* =========================================================
       4K DATABASE ARCHITECTURE SIMULATION
    ========================================================= */
    const DataStore = {
      categories: [
        { id: 'craft', label: 'Craft & Structure', desc: 'Words in context, text purpose.' },
        { id: 'info', label: 'Information & Ideas', desc: 'Central ideas, command of evidence.' },
        { id: 'english', label: 'Standard English', desc: 'Grammar, punctuation, verbs.' },
        { id: 'expr', label: 'Expression of Ideas', desc: 'Transitions, rhetorical synthesis.' }
      ],
      samples: {
        craft: [{
          text: "While investigating the effects of extreme pressure on carbon structures, the research team discovered that the newly synthesized material was remarkably ______; it resisted scratching by diamonds, the hardest known natural substance.",
          prompt: "Which choice completes the text with the most logical and precise word or phrase?",
          options: ["brittle", "resilient", "porous", "malleable"],
          answer: 1,
          explanation: "The material resists scratching by diamonds, indicating durability. 'Resilient' fits the context perfectly."
        }]
      },
      async fetchQuestions(categoryId, count = 3) {
        let qs = this.samples[categoryId] ? [...this.samples[categoryId]] : [];
        for(let i = qs.length; i < count; i++) {
          qs.push({
            text: `[Database Q${i + 1}] This represents a scalable question pulled dynamically from the 4K+ dataset for the ${categoryId} module.`,
            prompt: "What is the correct logical conclusion based on the text?",
            options: ["Incorrect Option A", "Correct Option B", "Incorrect Option C", "Incorrect Option D"],
            answer: 1,
            explanation: `Explanation for Q${i+1}: Option B is strictly correct based on the rules of ${categoryId}.`
          });
        }
        return qs;
      }
    };

    /* =========================================================
       APP STATE & GLOBAL STATS
    ========================================================= */
    const State = {
      global: { right: 0, wrong: 0, total: 0 },
      session: { questions: [], answers: [], currentIdx: 0, categoryLabel: '' }
    };

    function initStats() {
      const saved = localStorage.getItem('sat_systems_stats');
      if (saved) State.global = JSON.parse(saved);
      updateStatsUI();
    }

    function saveStats() {
      localStorage.setItem('sat_systems_stats', JSON.stringify(State.global));
      updateStatsUI();
    }

    function updateStatsUI() {
      const { right, wrong, total } = State.global;
      document.getElementById('nav-right').innerText = right;
      document.getElementById('nav-wrong').innerText = wrong;
      const percent = total === 0 ? 0 : Math.round((right / total) * 100);
      document.getElementById('nav-acc').innerText = `${percent}%`;
    }

    function resetStats() {
      if(confirm("Are you sure you want to wipe your global statistics?")) {
        State.global = { right: 0, wrong: 0, total: 0 };
        saveStats();
      }
    }

    /* =========================================================
       UI ROUTING & RENDERING
    ========================================================= */
    function navigate(viewId) {
      ['home', 'quiz', 'results'].forEach(id => {
        document.getElementById(`view-${id}`).classList.add('hidden');
      });
      document.getElementById(`view-${viewId}`).classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      lucide.createIcons();
    }

    // Render Home Category Cards (Duolingo tile style)
    const moduleGrid = document.getElementById('module-grid');
    DataStore.categories.forEach(cat => {
      const card = document.createElement('div');
      card.className = "bg-white dark:bg-[#1A1A1A] border-2 border-black/10 dark:border-white/10 p-5 md:p-6 rounded-2xl cursor-pointer group tile-bouncy shadow-light-3d";
      card.innerHTML = `
        <div class="w-12 h-12 rounded-xl bg-brand/10 text-brand flex items-center justify-center mb-4 border-2 border-brand/20">
          <i data-lucide="book-open" class="w-6 h-6"></i>
        </div>
        <h3 class="font-display font-black text-xl mb-1">${cat.label}</h3>
        <p class="text-sm text-text-muted dark:text-text-mutedDark">${cat.desc}</p>
      `;
      card.onclick = () => startSession(cat.id, cat.label);
      moduleGrid.appendChild(card);
    });

    async function startSession(categoryId, label) {
      State.session.categoryLabel = label;
      State.session.questions = await DataStore.fetchQuestions(categoryId, 4);
      State.session.answers = [];
      State.session.currentIdx = 0;
      
      renderQuestion();
      navigate('quiz');
    }

    function renderQuestion() {
      const q = State.session.questions[State.session.currentIdx];
      
      document.getElementById('q-counter').innerText = `${State.session.currentIdx + 1} / ${State.session.questions.length}`;
      document.getElementById('q-module').innerText = State.session.categoryLabel;
      document.getElementById('q-text').innerText = q.text;
      document.getElementById('q-prompt').innerText = q.prompt;

      const optsContainer = document.getElementById('q-options');
      optsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        // Duolingo thick tile physics
        btn.className = "w-full text-left p-4 md:p-5 bg-white dark:bg-[#1C1C1C] border-2 border-black/10 dark:border-white/10 rounded-2xl flex gap-3 md:gap-4 items-center group tile-bouncy shadow-light-3d";
        btn.innerHTML = `
          <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl border-2 border-black/10 dark:border-white/10 flex items-center justify-center flex-shrink-0 font-bold text-text-muted group-hover:bg-black/5 dark:group-hover:bg-white/5 transition-colors">
            ${String.fromCharCode(65 + idx)}
          </div>
          <span class="text-base md:text-lg font-semibold">${opt}</span>
        `;
        btn.onclick = () => handleAnswer(idx);
        optsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx) {
      const q = State.session.questions[State.session.currentIdx];
      const isCorrect = selectedIdx === q.answer;

      State.global.total += 1;
      if (isCorrect) State.global.right += 1;
      else State.global.wrong += 1;
      saveStats();

      State.session.answers.push({
        question: q,
        selected: selectedIdx,
        isCorrect: isCorrect
      });

      State.session.currentIdx++;
      if (State.session.currentIdx < State.session.questions.length) {
        // Small delay to allow the active bounce animation to play out visually
        setTimeout(renderQuestion, 150);
      } else {
        setTimeout(renderReview, 150);
      }
    }

    function renderReview() {
      const container = document.getElementById('review-list');
      container.innerHTML = '';

      State.session.answers.forEach((ans, idx) => {
        const item = document.createElement('div');
        const badgeColor = ans.isCorrect ? 'bg-correct' : 'bg-incorrect';
        const shadowClass = ans.isCorrect ? 'shadow-correct-3d' : 'shadow-incorrect-3d';
        const borderColor = ans.isCorrect ? 'border-correct/30' : 'border-incorrect/30';
        const label = ans.isCorrect ? 'Correct' : 'Incorrect';
        
        item.className = `bg-white dark:bg-[#1C1C1C] border-2 ${borderColor} rounded-2xl mb-4 tile-bouncy ${shadowClass}`;
        
        item.innerHTML = `
          <button class="w-full text-left p-5 md:p-6 flex justify-between items-center outline-none" onclick="this.nextElementSibling.classList.toggle('hidden')">
            <div class="flex items-center gap-3 md:gap-4 overflow-hidden pr-2">
              <span class="${badgeColor} text-white text-[10px] md:text-xs font-bold uppercase tracking-wider px-2 md:px-3 py-1 rounded-lg flex-shrink-0">${label}</span>
              <span class="font-bold truncate text-sm md:text-base">${ans.question.prompt}</span>
            </div>
            <i data-lucide="chevron-down" class="w-5 h-5 text-text-muted flex-shrink-0"></i>
          </button>
          
          <div class="hidden p-5 md:p-6 pt-0 border-t border-black/5 dark:border-white/5 mt-2">
            <p class="text-text-muted dark:text-text-mutedDark py-4 text-sm md:text-base">${ans.question.text}</p>
            
            <div class="flex flex-col gap-3 my-4 text-sm md:text-base">
              <div class="p-4 rounded-xl bg-black/5 dark:bg-white/5 border-2 ${ans.isCorrect ? 'border-transparent' : 'border-incorrect/30 text-incorrect'}">
                <span class="block text-[10px] font-bold uppercase mb-2 opacity-60">Your Answer</span>
                <span class="font-semibold">${ans.question.options[ans.selected]}</span>
              </div>
              <div class="p-4 rounded-xl bg-correct/10 border-2 border-correct/30 text-correct">
                <span class="block text-[10px] font-bold uppercase mb-2 opacity-80">Correct Answer</span>
                <span class="font-semibold">${ans.question.options[ans.question.answer]}</span>
              </div>
            </div>
            
            <div class="mt-4 p-5 bg-brand/5 border-l-4 border-brand rounded-r-xl text-sm text-text-main dark:text-text-dark">
              <span class="block font-black uppercase tracking-widest text-brand text-xs mb-2">System Analysis</span>
              ${ans.question.explanation}
            </div>
          </div>
        `;
        container.appendChild(item);
      });

      navigate('results');
    }

    initStats();
    lucide.createIcons();
  </script>
</body>
</html>
