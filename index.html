<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E0E5EC">
  <title>SAT Flow | Digital SAT Practice</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --surface: #E0E5EC;
      --foreground: #3D4852;
      --muted: #6B7280;
      --accent: #6C63FF;
      --accent-light: #8B84FF;
      --success: #38B2AC;

      --shadow-dark: rgba(163, 177, 198, 0.65);
      --shadow-light: rgba(255, 255, 255, 0.6);

      --radius-card: 32px;
      --radius-control: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--surface);
      color: var(--foreground);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    button {
      font-family: inherit;
    }

    .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* =========================================================
       NEUMORPHIC PHYSICS
    ========================================================= */

    .neu {
      background: var(--surface);
      box-shadow:
        9px 9px 16px var(--shadow-dark),
        -9px -9px 16px var(--shadow-light);
    }

    .neu-hover {
      transition:
        transform 300ms ease-out,
        box-shadow 300ms ease-out;
    }

    .neu-hover:hover {
      transform: translateY(-2px);
      box-shadow:
        12px 12px 20px rgba(163, 177, 198, 0.7),
        -12px -12px 20px rgba(255, 255, 255, 0.65);
    }

    .neu-hover:active {
      transform: translateY(0.5px);
      box-shadow:
        inset 3px 3px 6px rgba(163, 177, 198, 0.6),
        inset -3px -3px 6px rgba(255, 255, 255, 0.5);
    }

    .neu-small {
      background: var(--surface);
      box-shadow:
        5px 5px 10px rgba(163, 177, 198, 0.6),
        -5px -5px 10px rgba(255, 255, 255, 0.5);
    }

    .neu-inset {
      background: var(--surface);
      box-shadow:
        inset 6px 6px 10px rgba(163, 177, 198, 0.6),
        inset -6px -6px 10px rgba(255, 255, 255, 0.5);
    }

    .neu-deep {
      background: var(--surface);
      box-shadow:
        inset 10px 10px 20px rgba(163, 177, 198, 0.7),
        inset -10px -10px 20px rgba(255, 255, 255, 0.6);
    }

    .neu-inset-small {
      background: var(--surface);
      box-shadow:
        inset 3px 3px 6px rgba(163, 177, 198, 0.6),
        inset -3px -3px 6px rgba(255, 255, 255, 0.5);
    }

    /* =========================================================
       ACCESSIBILITY
    ========================================================= */

    button:focus-visible {
      outline: none;
      box-shadow:
        0 0 0 2px var(--surface),
        0 0 0 4px var(--accent),
        9px 9px 16px var(--shadow-dark),
        -9px -9px 16px var(--shadow-light);
    }

    /* =========================================================
       MOBILE APP CONTAINER
    ========================================================= */

    .mobile-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* =========================================================
       SUBTLE AMBIENT DECORATION
    ========================================================= */

    .ambient-circle {
      position: fixed;
      pointer-events: none;
      border-radius: 9999px;
      opacity: 0.45;
      z-index: -1;
    }

    .ambient-circle.one {
      width: 180px;
      height: 180px;
      top: -90px;
      left: -70px;
      box-shadow:
        inset 12px 12px 24px rgba(163, 177, 198, 0.25),
        inset -12px -12px 24px rgba(255, 255, 255, 0.35);
    }

    .ambient-circle.two {
      width: 220px;
      height: 220px;
      right: -120px;
      bottom: -100px;
      box-shadow:
        inset 12px 12px 24px rgba(163, 177, 198, 0.25),
        inset -12px -12px 24px rgba(255, 255, 255, 0.35);
    }

    /* =========================================================
       ICON WELLS
    ========================================================= */

    .icon-well {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      box-shadow:
        inset 6px 6px 10px rgba(163, 177, 198, 0.6),
        inset -6px -6px 10px rgba(255, 255, 255, 0.5);
    }

    .brand-icon {
      color: var(--accent);
    }

    /* =========================================================
       CATEGORY CARDS
    ========================================================= */

    .category-card {
      background: var(--surface);
      border: none;
      box-shadow:
        9px 9px 16px rgba(163, 177, 198, 0.65),
        -9px -9px 16px rgba(255, 255, 255, 0.6);

      transition:
        transform 300ms ease-out,
        box-shadow 300ms ease-out;
    }

    .category-card:hover {
      transform: translateY(-2px);
      box-shadow:
        12px 12px 20px rgba(163, 177, 198, 0.7),
        -12px -12px 20px rgba(255, 255, 255, 0.65);
    }

    .category-card:active {
      transform: translateY(0.5px);
      box-shadow:
        inset 3px 3px 6px rgba(163, 177, 198, 0.6),
        inset -3px -3px 6px rgba(255, 255, 255, 0.5);
    }

    /* =========================================================
       ANSWER BUTTONS
    ========================================================= */

    .answer-button {
      min-height: 58px;
      background: var(--surface);
      color: var(--foreground);

      box-shadow:
        6px 6px 12px rgba(163, 177, 198, 0.6),
        -6px -6px 12px rgba(255, 255, 255, 0.5);

      transition:
        transform 250ms ease-out,
        box-shadow 250ms ease-out;
    }

    .answer-button:hover {
      transform: translateY(-1px);
      box-shadow:
        8px 8px 15px rgba(163, 177, 198, 0.65),
        -8px -8px 15px rgba(255, 255, 255, 0.55);
    }

    .answer-button:active {
      transform: translateY(1px);
      box-shadow:
        inset 5px 5px 9px rgba(163, 177, 198, 0.6),
        inset -5px -5px 9px rgba(255, 255, 255, 0.5);
    }

    .answer-letter {
      background: var(--surface);
      box-shadow:
        inset 3px 3px 6px rgba(163, 177, 198, 0.55),
        inset -3px -3px 6px rgba(255, 255, 255, 0.5);
      color: var(--muted);
    }

    .answer-button.correct {
      color: #247f79;
      box-shadow:
        inset 5px 5px 9px rgba(163, 177, 198, 0.45),
        inset -5px -5px 9px rgba(255, 255, 255, 0.5),
        0 0 0 2px rgba(56, 178, 172, 0.25);
    }

    .answer-button.incorrect {
      color: #a94a4a;
      box-shadow:
        inset 5px 5px 9px rgba(163, 177, 198, 0.45),
        inset -5px -5px 9px rgba(255, 255, 255, 0.5),
        0 0 0 2px rgba(190, 80, 80, 0.2);
    }

    /* =========================================================
       PRIMARY BUTTON
    ========================================================= */

    .primary-button {
      background: var(--accent);
      color: white;
      border: none;

      box-shadow:
        7px 7px 14px rgba(163, 177, 198, 0.65),
        -7px -7px 14px rgba(255, 255, 255, 0.55);

      transition:
        transform 300ms ease-out,
        box-shadow 300ms ease-out;
    }

    .primary-button:hover {
      transform: translateY(-2px);
      background: var(--accent-light);
      box-shadow:
        10px 10px 18px rgba(163, 177, 198, 0.7),
        -10px -10px 18px rgba(255, 255, 255, 0.6);
    }

    .primary-button:active {
      transform: translateY(0.5px);
      box-shadow:
        inset 5px 5px 10px rgba(65, 59, 170, 0.4),
        inset -5px -5px 10px rgba(255, 255, 255, 0.25);
    }

    /* =========================================================
       PROGRESS
    ========================================================= */

    .progress-track {
      height: 10px;
      border-radius: 9999px;

      box-shadow:
        inset 3px 3px 6px rgba(163, 177, 198, 0.6),
        inset -3px -3px 6px rgba(255, 255, 255, 0.5);
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: var(--accent);
      box-shadow:
        2px 2px 5px rgba(163, 177, 198, 0.35),
        -2px -2px 5px rgba(255, 255, 255, 0.25);

      transition: width 300ms ease-out;
    }

    /* =========================================================
       QUESTION CARD
    ========================================================= */

    .question-card {
      background: var(--surface);
      box-shadow:
        11px 11px 20px rgba(163, 177, 198, 0.65),
        -11px -11px 20px rgba(255, 255, 255, 0.6);
    }

    /* =========================================================
       EXPLANATION
    ========================================================= */

    .explanation-box {
      background: var(--surface);
      box-shadow:
        inset 5px 5px 10px rgba(163, 177, 198, 0.55),
        inset -5px -5px 10px rgba(255, 255, 255, 0.5);
    }

    /* =========================================================
       VIEW ANIMATION
    ========================================================= */

    .view-enter {
      animation: viewEnter 350ms ease-out;
    }

    @keyframes viewEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .answer-enter {
      animation: answerEnter 300ms ease-out both;
    }

    @keyframes answerEnter {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       SCROLLBAR
    ========================================================= */

    ::-webkit-scrollbar {
      display: none;
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- Subtle neumorphic ambient decoration -->
  <div class="ambient-circle one"></div>
  <div class="ambient-circle two"></div>

  <!-- Mobile App -->
  <div class="mobile-container flex flex-col p-5 overflow-y-auto pb-10">

    <!-- =======================================================
         HEADER
    ======================================================== -->

    <header class="flex items-center justify-between py-4 mb-6">

      <button
        onclick="goHome()"
        aria-label="Return to home"
        class="flex items-center gap-3 bg-transparent border-0 p-0 rounded-2xl focus:outline-none"
      >
        <div class="icon-well w-11 h-11 rounded-2xl">
          <i data-lucide="droplets" class="w-5 h-5 brand-icon"></i>
        </div>

        <h1 class="font-display text-xl font-extrabold tracking-tight">
          SAT
          <span class="font-medium text-[#6C63FF]">Flow</span>
        </h1>
      </button>

      <div
        id="score-badge"
        class="hidden neu-small px-4 py-2 rounded-full text-sm font-bold text-[#3D4852]"
      >
        Score:
        <span id="current-score" class="text-[#6C63FF]">0</span>
      </div>

    </header>

    <!-- =======================================================
         HOME
    ======================================================== -->

    <main id="home-view" class="flex-1 flex flex-col gap-5 view-enter">

      <div class="mb-3 px-1">
        <p class="text-xs font-bold uppercase tracking-[0.18em] text-[#6C63FF] mb-2">
          SAT English
        </p>

        <h2 class="font-display text-3xl font-extrabold tracking-tight mb-2">
          Ready to practice?
        </h2>

        <p class="text-sm text-[#6B7280] leading-relaxed">
          Choose a skill and sharpen your English one question at a time.
        </p>
      </div>

      <!-- Craft -->
      <button
        onclick="startQuiz('craft')"
        class="category-card w-full rounded-[32px] p-5 text-left flex items-center justify-between group"
      >
        <div class="flex gap-4 items-center min-w-0">

          <div class="icon-well w-14 h-14 shrink-0 rounded-2xl text-[#6C63FF]">
            <i data-lucide="book-open" class="w-6 h-6"></i>
          </div>

          <div class="min-w-0">
            <h3 class="font-display text-base font-bold tracking-tight">
              Craft & Structure
            </h3>

            <p class="text-xs text-[#6B7280] mt-1 leading-relaxed">
              Words in context, text purpose.
            </p>
          </div>

        </div>

        <div class="icon-well w-9 h-9 rounded-xl shrink-0 ml-3">
          <i data-lucide="chevron-right" class="w-4 h-4 text-[#6B7280]"></i>
        </div>
      </button>

      <!-- Information -->
      <button
        onclick="startQuiz('info')"
        class="category-card w-full rounded-[32px] p-5 text-left flex items-center justify-between group"
      >
        <div class="flex gap-4 items-center min-w-0">

          <div class="icon-well w-14 h-14 shrink-0 rounded-2xl text-[#6C63FF]">
            <i data-lucide="lightbulb" class="w-6 h-6"></i>
          </div>

          <div class="min-w-0">
            <h3 class="font-display text-base font-bold tracking-tight">
              Information & Ideas
            </h3>

            <p class="text-xs text-[#6B7280] mt-1 leading-relaxed">
              Central ideas, command of evidence.
            </p>
          </div>

        </div>

        <div class="icon-well w-9 h-9 rounded-xl shrink-0 ml-3">
          <i data-lucide="chevron-right" class="w-4 h-4 text-[#6B7280]"></i>
        </div>
      </button>

      <!-- Standard English -->
      <button
        onclick="startQuiz('conventions')"
        class="category-card w-full rounded-[32px] p-5 text-left flex items-center justify-between group"
      >
        <div class="flex gap-4 items-center min-w-0">

          <div class="icon-well w-14 h-14 shrink-0 rounded-2xl text-[#6C63FF]">
            <i data-lucide="check-circle" class="w-6 h-6"></i>
          </div>

          <div class="min-w-0">
            <h3 class="font-display text-base font-bold tracking-tight">
              Standard English
            </h3>

            <p class="text-xs text-[#6B7280] mt-1 leading-relaxed">
              Grammar, punctuation, verbs.
            </p>
          </div>

        </div>

        <div class="icon-well w-9 h-9 rounded-xl shrink-0 ml-3">
          <i data-lucide="chevron-right" class="w-4 h-4 text-[#6B7280]"></i>
        </div>
      </button>

      <!-- Expression -->
      <button
        onclick="startQuiz('expression')"
        class="category-card w-full rounded-[32px] p-5 text-left flex items-center justify-between group"
      >
        <div class="flex gap-4 items-center min-w-0">

          <div class="icon-well w-14 h-14 shrink-0 rounded-2xl text-[#6C63FF]">
            <i data-lucide="pen-tool" class="w-6 h-6"></i>
          </div>

          <div class="min-w-0">
            <h3 class="font-display text-base font-bold tracking-tight">
              Expression of Ideas
            </h3>

            <p class="text-xs text-[#6B7280] mt-1 leading-relaxed">
              Transitions, rhetorical synthesis.
            </p>
          </div>

        </div>

        <div class="icon-well w-9 h-9 rounded-xl shrink-0 ml-3">
          <i data-lucide="chevron-right" class="w-4 h-4 text-[#6B7280]"></i>
        </div>
      </button>

    </main>

    <!-- =======================================================
         QUIZ
    ======================================================== -->

    <main id="quiz-view" class="hidden flex-1 flex flex-col relative view-enter">

      <!-- Quiz top row -->
      <div class="flex items-center justify-between mb-3">

        <button
          onclick="goHome()"
          class="flex items-center gap-1.5 text-xs font-bold text-[#6B7280] hover:text-[#3D4852] transition-colors rounded-xl px-2 py-2"
        >
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          Exit
        </button>

        <span
          id="question-counter"
          class="text-xs font-bold text-[#6B7280]"
        >
          Question 1 of 1
        </span>

      </div>

      <!-- Progress -->
      <div class="progress-track w-full mb-6">
        <div
          id="progress-bar"
          class="progress-fill w-0"
        ></div>
      </div>

      <!-- Question Card -->
      <div class="question-card p-6 rounded-[32px] mb-6">

        <span
          id="q-category"
          class="text-[10px] uppercase tracking-[0.18em] text-[#6C63FF] font-bold mb-4 block"
        >
          Section
        </span>

        <p
          id="q-text"
          class="text-[15px] leading-7 font-medium text-[#3D4852]"
        ></p>

        <p
          id="q-prompt"
          class="mt-5 pt-5 border-t border-[#cbd3dc] font-bold text-sm leading-6 text-[#3D4852]"
        ></p>

      </div>

      <!-- Options -->
      <div
        id="options-container"
        class="flex flex-col gap-4 mb-6 flex-1"
      ></div>

      <!-- Explanation -->
      <div
        id="explanation-box"
        class="hidden explanation-box p-5 rounded-[24px] mb-6"
      >

        <div class="flex items-center gap-2 mb-2">

          <div
            class="icon-well w-8 h-8 rounded-xl"
          >
            <i
              data-lucide="info"
              class="w-4 h-4 text-[#6C63FF]"
            ></i>
          </div>

          <h4
            class="font-display font-bold text-sm"
            id="exp-title"
          >
            Explanation
          </h4>

        </div>

        <p
          class="text-xs text-[#6B7280] leading-relaxed"
          id="exp-text"
        ></p>

      </div>

      <!-- Next -->
      <button
        id="next-btn"
        onclick="nextQuestion()"
        class="hidden primary-button w-full min-h-[52px] rounded-2xl font-bold text-sm"
      >
        Next Question
        <i data-lucide="arrow-right" class="inline-block w-4 h-4 ml-1"></i>
      </button>

    </main>

    <!-- =======================================================
         RESULTS
    ======================================================== -->

    <main
      id="result-view"
      class="hidden flex-1 flex flex-col items-center justify-center text-center view-enter"
    >

      <div class="neu p-8 rounded-[32px] flex flex-col items-center w-full max-w-sm">

        <!-- Trophy well -->
        <div
          class="icon-well w-20 h-20 rounded-full flex items-center justify-center mb-6"
        >
          <i
            data-lucide="award"
            class="w-9 h-9 text-[#6C63FF]"
          ></i>
        </div>

        <p class="text-xs font-bold uppercase tracking-[0.18em] text-[#6C63FF] mb-2">
          Session complete
        </p>

        <h2 class="font-display text-2xl font-extrabold tracking-tight mb-6">
          Nice work.
        </h2>

        <div
          class="neu-deep rounded-[28px] px-10 py-6 mb-6"
        >
          <div
            id="final-score"
            class="font-display text-5xl font-extrabold tracking-tight text-[#6C63FF]"
          >
            0
          </div>

          <div class="text-sm font-medium text-[#6B7280] mt-1">
            out of
            <span id="total-q">0</span>
          </div>
        </div>

        <p class="text-sm text-[#6B7280] leading-relaxed mb-8">
          Keep practicing and build your accuracy one session at a time.
        </p>

        <button
          onclick="goHome()"
          class="primary-button w-full min-h-[52px] rounded-2xl font-bold text-sm"
        >
          Back to Practice
        </button>

      </div>

    </main>

  </div>

  <script>

    /* =========================================================
       ICONS
    ========================================================= */

    lucide.createIcons();


    /* =========================================================
       QUESTION BANK
    ========================================================= */

    const questionBank = {

      craft: [
        {
          text: "While investigating the effects of extreme pressure on carbon structures, the research team discovered that the newly synthesized material was remarkably ______; it resisted scratching by diamonds, the hardest known natural substance.",
          prompt: "Which choice completes the text with the most logical and precise word or phrase?",
          options: [
            "brittle",
            "resilient",
            "porous",
            "malleable"
          ],
          answer: 1,
          explanation: "The material resists scratching by diamonds, indicating that it is highly durable. 'Resilient' is therefore the best choice."
        }
      ],

      info: [
        {
          text: "Many historians attribute the rapid spread of the printing press in the 15th century to the dropping cost of paper. However, economist John Smith argues that the standardization of local dialects was the true catalyst, as it guaranteed a massive, unified market of readers for printers to sell to.",
          prompt: "Which statement best describes the main idea of the text?",
          options: [
            "Historians and economists agree that paper costs drove the printing revolution.",
            "Smith believes language standardization, not cheap paper, primarily drove the success of the printing press.",
            "The printing press caused local dialects to become standardized.",
            "The rapid spread of the printing press forced the price of paper to drop."
          ],
          answer: 1,
          explanation: "The text contrasts the view of many historians with Smith's argument that language standardization created a larger unified market."
        }
      ],

      conventions: [
        {
          text: "The giant Pacific octopus is incredibly intelligent. Researchers have observed the creatures navigating mazes, unscrewing jars to retrieve food, and ______ out of their tanks to explore the laboratory floor.",
          prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?",
          options: [
            "to sneak",
            "sneaking",
            "sneaks",
            "snuck"
          ],
          answer: 1,
          explanation: "The sentence uses a parallel series: 'navigating,' 'unscrewing,' and 'sneaking.'"
        }
      ],

      expression: [
        {
          text: "Electric vehicles (EVs) produce zero tailpipe emissions, making them highly attractive for cities battling severe air pollution. ______, the batteries that power these vehicles require lithium mining, an extractive process that can cause significant environmental degradation in rural areas.",
          prompt: "Which choice completes the text with the most logical transition?",
          options: [
            "Consequently",
            "For example",
            "Nevertheless",
            "Similarly"
          ],
          answer: 2,
          explanation: "'Nevertheless' is the best transition because the second sentence introduces a limitation that contrasts with the benefit described in the first sentence."
        }
      ]

    };


    /* =========================================================
       APP STATE
    ========================================================= */

    let currentCategory = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;


    /* =========================================================
       DOM
    ========================================================= */

    const views = {
      home: document.getElementById('home-view'),
      quiz: document.getElementById('quiz-view'),
      result: document.getElementById('result-view')
    };


    /* =========================================================
       VIEW MANAGEMENT
    ========================================================= */

    function showView(viewName) {

      Object.values(views).forEach(view => {
        view.classList.add('hidden');
        view.classList.remove('view-enter');
      });

      views[viewName].classList.remove('hidden');

      void views[viewName].offsetWidth;

      views[viewName].classList.add('view-enter');

      lucide.createIcons();
    }


    function goHome() {

      showView('home');

      document
        .getElementById('score-badge')
        .classList.add('hidden');
    }


    /* =========================================================
       START QUIZ
    ========================================================= */

    function startQuiz(category) {

      currentCategory = category;

      currentQuestions = questionBank[category];

      currentIndex = 0;
      score = 0;

      document
        .getElementById('current-score')
        .innerText = score;

      document
        .getElementById('score-badge')
        .classList.remove('hidden');

      showView('quiz');

      renderQuestion();
    }


    /* =========================================================
       RENDER QUESTION
    ========================================================= */

    function renderQuestion() {

      const q = currentQuestions[currentIndex];

      document.getElementById('q-category').innerText =
        currentCategory
          .replace(/([A-Z])/g, ' $1')
          .trim();

      document.getElementById('q-text').innerText =
        q.text;

      document.getElementById('q-prompt').innerText =
        q.prompt;

      document.getElementById('question-counter').innerText =
        `Question ${currentIndex + 1} of ${currentQuestions.length}`;

      document
        .getElementById('explanation-box')
        .classList.add('hidden');

      document
        .getElementById('next-btn')
        .classList.add('hidden');

      const progress =
        ((currentIndex + 1) / currentQuestions.length) * 100;

      document
        .getElementById('progress-bar')
        .style.width = `${progress}%`;

      const optionsContainer =
        document.getElementById('options-container');

      optionsContainer.innerHTML = '';

      q.options.forEach((opt, index) => {

        const btn = document.createElement('button');

        btn.className =
          'answer-button w-full px-4 py-3 rounded-2xl text-left text-sm font-medium flex items-center group answer-enter';

        btn.style.animationDelay =
          `${index * 50}ms`;

        btn.innerHTML = `
          <span class="answer-letter w-9 h-9 rounded-xl flex items-center justify-center text-xs font-bold mr-3 shrink-0">
            ${String.fromCharCode(65 + index)}
          </span>

          <span class="flex-1">
            ${opt}
          </span>
        `;

        btn.onclick = () =>
          selectAnswer(index, btn);

        optionsContainer.appendChild(btn);
      });

      lucide.createIcons();
    }


    /* =========================================================
       SELECT ANSWER
    ========================================================= */

    function selectAnswer(selectedIndex, btnElement) {

      const q =
        currentQuestions[currentIndex];

      const buttons =
        document.getElementById('options-container').children;

      for (const btn of buttons) {
        btn.onclick = null;
        btn.style.pointerEvents = 'none';
        btn.style.opacity = '0.75';
      }

      const isCorrect =
        selectedIndex === q.answer;

      if (isCorrect) {

        btnElement.classList.add('correct');

        score++;

        document.getElementById('current-score').innerText =
          score;

        document.getElementById('exp-title').innerText =
          'Correct!';

        document.getElementById('exp-title').style.color =
          '#38B2AC';

      } else {

        btnElement.classList.add('incorrect');

        buttons[q.answer].classList.add('correct');

        document.getElementById('exp-title').innerText =
          'Not quite';

        document.getElementById('exp-title').style.color =
          '#A94A4A';
      }

      document.getElementById('exp-text').innerText =
        q.explanation;

      document
        .getElementById('explanation-box')
        .classList.remove('hidden');

      document
        .getElementById('next-btn')
        .classList.remove('hidden');

      lucide.createIcons();
    }


    /* =========================================================
       NEXT QUESTION
    ========================================================= */

    function nextQuestion() {

      currentIndex++;

      if (currentIndex < currentQuestions.length) {

        renderQuestion();

      } else {

        showResults();
      }
    }


    /* =========================================================
       RESULTS
    ========================================================= */

    function showResults() {

      document.getElementById('progress-bar')
        .style.width = '100%';

      setTimeout(() => {

        showView('result');

        document.getElementById('final-score')
          .innerText = score;

        document.getElementById('total-q')
          .innerText = currentQuestions.length;

        document.getElementById('score-badge')
          .classList.add('hidden');

        lucide.createIcons();

      }, 250);
    }

  </script>

</body>
</html>
