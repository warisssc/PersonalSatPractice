<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAT Functional Practice</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#0055FF',
            brandDark: '#3377FF',
            surfaceLight: '#FFFFFF',
            surfaceDark: '#0A0A0A',
            borderLight: '#E5E5E5',
            borderDark: '#262626',
            textLight: '#111111',
            textDark: '#F5F5F5',
            mutedLight: '#737373',
            mutedDark: '#A3A3A3',
            correct: '#008A00',
            incorrect: '#E50000'
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          spacing: {
            '8px': '8px',
            '16px': '16px',
            '24px': '24px',
            '32px': '32px',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons (Restricted to functional icons only) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Base theme variables and smooth transitions */
    :root {
      color-scheme: light;
    }
    html.dark {
      color-scheme: dark;
    }
    body {
      transition: background-color 0.3s ease, color 0.3s ease;
      background-color: theme('colors.surfaceLight');
      color: theme('colors.textLight');
    }
    html.dark body {
      background-color: theme('colors.surfaceDark');
      color: theme('colors.textDark');
    }
    
    /* Utility transitions */
    .theme-transition {
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    /* Sharp, non-vibe buttons */
    .btn-outline {
      border: 1px solid theme('colors.borderLight');
      background: transparent;
    }
    html.dark .btn-outline {
      border-color: theme('colors.borderDark');
    }
    .btn-outline:hover {
      background: theme('colors.textLight');
      color: theme('colors.surfaceLight');
    }
    html.dark .btn-outline:hover {
      background: theme('colors.textDark');
      color: theme('colors.surfaceDark');
    }

    /* Hide scrollbar for clean aesthetic */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="antialiased min-h-screen font-sans flex flex-col md:flex-row overflow-hidden">

  <!-- ==========================================
       ASYSMMETRICAL LEFT PANEL: STATS & CONTROLS
  =========================================== -->
  <aside class="w-full md:w-[320px] lg:w-[400px] flex-shrink-0 border-b md:border-b-0 md:border-r border-borderLight dark:border-borderDark h-auto md:h-screen p-24px flex flex-col justify-between theme-transition">
    <div>
      <div class="flex justify-between items-start mb-32px">
        <h1 class="text-2xl font-bold tracking-tight uppercase">SAT<br>Data_Set</h1>
        <button id="theme-toggle" class="p-8px border border-borderLight dark:border-borderDark hover:bg-textLight dark:hover:bg-textDark hover:text-surfaceLight dark:hover:text-surfaceDark transition-colors">
          <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
      </div>

      <!-- Global Stats -->
      <div class="space-y-16px mb-32px">
        <h2 class="text-xs font-mono tracking-widest text-mutedLight dark:text-mutedDark uppercase">Global Metrics</h2>
        
        <div class="grid grid-cols-2 gap-8px">
          <div class="border border-borderLight dark:border-borderDark p-16px">
            <span class="text-xs font-mono text-mutedLight dark:text-mutedDark block mb-8px">Accuracy</span>
            <span id="stat-percent" class="text-3xl font-bold text-brand dark:text-brandDark">0%</span>
          </div>
          <div class="border border-borderLight dark:border-borderDark p-16px">
            <span class="text-xs font-mono text-mutedLight dark:text-mutedDark block mb-8px">Total Qs</span>
            <span id="stat-total" class="text-3xl font-bold">0</span>
          </div>
        </div>

        <div class="flex gap-8px">
          <div class="flex-1 border border-borderLight dark:border-borderDark p-8px text-center">
            <span class="text-[10px] font-mono uppercase block mb-1">Right</span>
            <span id="stat-right" class="text-lg font-bold text-correct">0</span>
          </div>
          <div class="flex-1 border border-borderLight dark:border-borderDark p-8px text-center">
            <span class="text-[10px] font-mono uppercase block mb-1">Wrong</span>
            <span id="stat-wrong" class="text-lg font-bold text-incorrect">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation / Reset -->
    <div class="hidden md:block">
      <button onclick="resetStats()" class="w-full text-left text-xs font-mono text-mutedLight dark:text-mutedDark hover:text-textLight dark:hover:text-textDark py-8px border-t border-borderLight dark:border-borderDark theme-transition">
        [ Reset Data ]
      </button>
    </div>
  </aside>

  <!-- ==========================================
       RIGHT PANEL: DYNAMIC CONTENT AREA
  =========================================== -->
  <main class="flex-1 h-[calc(100vh-250px)] md:h-screen overflow-y-auto p-24px md:p-32px lg:p-48px bg-surfaceLight dark:bg-surfaceDark theme-transition relative">
    
    <!-- VIEW: CATEGORIES (HOME) -->
    <div id="view-home" class="max-w-3xl">
      <h2 class="text-lg font-bold mb-24px">Select Module</h2>
      <div class="flex flex-col gap-8px" id="category-list">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- VIEW: QUIZ -->
    <div id="view-quiz" class="hidden max-w-3xl flex flex-col h-full">
      <div class="flex justify-between items-center mb-24px pb-16px border-b border-borderLight dark:border-borderDark">
        <button onclick="navigate('home')" class="text-xs font-mono uppercase hover:text-brand dark:hover:text-brandDark flex items-center gap-2">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
        </button>
        <span id="q-counter" class="text-xs font-mono">Q: 0/0</span>
      </div>

      <div class="flex-1">
        <span id="q-module" class="text-xs font-mono text-brand dark:text-brandDark uppercase tracking-widest mb-16px block">Module</span>
        <p id="q-text" class="text-base md:text-lg leading-relaxed mb-24px"></p>
        <p id="q-prompt" class="font-bold text-sm mb-32px pb-16px border-b border-borderLight dark:border-borderDark"></p>
        
        <div id="q-options" class="flex flex-col gap-8px">
          <!-- Options injected by JS -->
        </div>
      </div>
    </div>

    <!-- VIEW: RESULTS & REVIEW -->
    <div id="view-results" class="hidden max-w-3xl">
      <div class="mb-32px pb-24px border-b border-borderLight dark:border-borderDark flex justify-between items-end">
        <div>
          <h2 class="text-2xl font-bold mb-8px">Session Complete</h2>
          <p class="text-sm text-mutedLight dark:text-mutedDark">Review your answers below.</p>
        </div>
        <button onclick="navigate('home')" class="btn-outline px-16px py-8px text-xs font-mono uppercase">
          Return Home
        </button>
      </div>

      <div id="review-list" class="flex flex-col gap-16px">
        <!-- Review items injected by JS -->
      </div>
    </div>

  </main>

  <script>
    /* =========================================================
       THEME MANAGEMENT
    ========================================================= */
    const themeToggle = document.getElementById('theme-toggle');
    const html = document.documentElement;

    // Check system preference or localStorage
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
    }

    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
    });

    /* =========================================================
       DATABASE ARCHITECTURE (Supports 4K+ Questions)
    ========================================================= */
    // Instead of loading 4,000 questions into memory, this structure allows fetching in chunks.
    const DataStore = {
      categories: [
        { id: 'craft', label: 'Craft & Structure', desc: 'Words in context, text purpose.' },
        { id: 'info', label: 'Information & Ideas', desc: 'Central ideas, command of evidence.' },
        { id: 'english', label: 'Standard English', desc: 'Grammar, punctuation, verbs.' },
        { id: 'expr', label: 'Expression of Ideas', desc: 'Transitions, rhetorical synthesis.' }
      ],
      
      // Hardcoded samples based on original file context[span_0](start_span)[span_0](end_span)
      samples: {
        craft: [{
          text: "While investigating the effects of extreme pressure on carbon structures, the research team discovered that the newly synthesized material was remarkably ______; it resisted scratching by diamonds, the hardest known natural substance.",
          prompt: "Which choice completes the text with the most logical and precise word or phrase?",
          options: ["brittle", "resilient", "porous", "malleable"],
          answer: 1,
          explanation: "The material resists scratching by diamonds, indicating durability. 'Resilient' fits the context perfectly."
        }],
        info: [{
          text: "Many historians attribute the rapid spread of the printing press in the 15th century to the dropping cost of paper. However, economist John Smith argues that the standardization of local dialects was the true catalyst, as it guaranteed a massive, unified market of readers for printers to sell to.",
          prompt: "Which statement best describes the main idea of the text?",
          options: [
            "Historians and economists agree that paper costs drove the printing revolution.",
            "Smith believes language standardization, not cheap paper, primarily drove the success of the printing press.",
            "The printing press caused local dialects to become standardized.",
            "The rapid spread of the printing press forced the price of paper to drop."
          ],
          answer: 1,
          explanation: "The text contrasts historians' views with Smith's argument regarding language standardization."
        }],
        english: [{
          text: "The giant Pacific octopus is incredibly intelligent. Researchers have observed the creatures navigating mazes, unscrewing jars to retrieve food, and ______ out of their tanks to explore the laboratory floor.",
          prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?",
          options: ["to sneak", "sneaking", "sneaks", "snuck"],
          answer: 1,
          explanation: "Parallel structure requires 'sneaking' to match 'navigating' and 'unscrewing'."
        }],
        expr: [{
          text: "Electric vehicles (EVs) produce zero tailpipe emissions, making them highly attractive for cities battling severe air pollution. ______, the batteries that power these vehicles require lithium mining, an extractive process that can cause significant environmental degradation in rural areas.",
          prompt: "Which choice completes the text with the most logical transition?",
          options: ["Consequently", "For example", "Nevertheless", "Similarly"],
          answer: 2,
          explanation: "'Nevertheless' introduces a contrast (environmental degradation) to the previously stated benefit (zero emissions)."
        }]
      },

      // Simulated fetch for large database access
      async fetchQuestions(categoryId, count = 3) {
        // In a real app, this would be: return fetch(`/api/questions/${categoryId}?limit=${count}`).then(r => r.json());
        let qs = [...this.samples[categoryId]];
        
        // Mocking thousands of questions by generating synthetic ones if needed
        for(let i = qs.length; i < count; i++) {
          qs.push({
            text: `[Database Q${i + 1}] This is a synthetic question generated from the 4K+ database for the ${categoryId} section. Analyzing text...`,
            prompt: "What is the correct synthetic answer?",
            options: ["Incorrect Option A", "Correct Option B", "Incorrect Option C", "Incorrect Option D"],
            answer: 1,
            explanation: `This is a generated explanation for Q${i+1}, showing why Option B is strictly correct based on rules of ${categoryId}.`
          });
        }
        return qs;
      }
    };

    /* =========================================================
       APP STATE & LOGIC
    ========================================================= */
    const State = {
      global: { right: 0, wrong: 0, total: 0 },
      session: { questions: [], answers: [], currentIdx: 0, categoryLabel: '' }
    };

    // Load Stats from LocalStorage
    function initStats() {
      const saved = localStorage.getItem('sat_stats');
      if (saved) State.global = JSON.parse(saved);
      updateStatsUI();
    }

    function saveStats() {
      localStorage.setItem('sat_stats', JSON.stringify(State.global));
      updateStatsUI();
    }

    function updateStatsUI() {
      const { right, wrong, total } = State.global;
      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-right').innerText = right;
      document.getElementById('stat-wrong').innerText = wrong;
      
      const percent = total === 0 ? 0 : Math.round((right / total) * 100);
      document.getElementById('stat-percent').innerText = `${percent}%`;
    }

    function resetStats() {
      State.global = { right: 0, wrong: 0, total: 0 };
      saveStats();
    }

    /* =========================================================
       UI ROUTING & RENDERING
    ========================================================= */
    function navigate(viewId) {
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-quiz').classList.add('hidden');
      document.getElementById('view-results').classList.add('hidden');
      document.getElementById(`view-${viewId}`).classList.remove('hidden');
      lucide.createIcons();
    }

    // Render Home Categories
    const categoryList = document.getElementById('category-list');
    DataStore.categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = "w-full text-left p-24px border border-borderLight dark:border-borderDark hover:bg-textLight dark:hover:bg-textDark hover:text-surfaceLight dark:hover:text-surfaceDark transition-colors group flex justify-between items-center";
      btn.innerHTML = `
        <div>
          <h3 class="font-bold text-base mb-1">${cat.label}</h3>
          <p class="text-xs font-mono opacity-60">${cat.desc}</p>
        </div>
        <i data-lucide="arrow-right" class="w-5 h-5 opacity-0 group-hover:opacity-100 transition-opacity"></i>
      `;
      btn.onclick = () => startSession(cat.id, cat.label);
      categoryList.appendChild(btn);
    });

    // Start a Quiz Session
    async function startSession(categoryId, label) {
      State.session.categoryLabel = label;
      State.session.questions = await DataStore.fetchQuestions(categoryId, 4); // Pulling 4 per session for demo
      State.session.answers = [];
      State.session.currentIdx = 0;
      
      renderQuestion();
      navigate('quiz');
    }

    function renderQuestion() {
      const q = State.session.questions[State.session.currentIdx];
      
      document.getElementById('q-counter').innerText = `Q: ${State.session.currentIdx + 1} / ${State.session.questions.length}`;
      document.getElementById('q-module').innerText = State.session.categoryLabel;
      document.getElementById('q-text').innerText = q.text;
      document.getElementById('q-prompt').innerText = q.prompt;

      const optsContainer = document.getElementById('q-options');
      optsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-16px border border-borderLight dark:border-borderDark hover:border-textLight dark:hover:border-textDark transition-colors flex gap-16px items-start text-sm";
        btn.innerHTML = `
          <span class="font-mono text-xs mt-0.5 opacity-50">[${String.fromCharCode(65 + idx)}]</span>
          <span>${opt}</span>
        `;
        btn.onclick = () => handleAnswer(idx);
        optsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx) {
      const q = State.session.questions[State.session.currentIdx];
      const isCorrect = selectedIdx === q.answer;

      // Update Global Stats
      State.global.total += 1;
      if (isCorrect) State.global.right += 1;
      else State.global.wrong += 1;
      saveStats();

      // Save session answer for review
      State.session.answers.push({
        question: q,
        selected: selectedIdx,
        isCorrect: isCorrect
      });

      // Advance
      State.session.currentIdx++;
      if (State.session.currentIdx < State.session.questions.length) {
        renderQuestion();
      } else {
        renderReview();
      }
    }

    // Render Review UI
    function renderReview() {
      const container = document.getElementById('review-list');
      container.innerHTML = '';

      State.session.answers.forEach((ans, idx) => {
        const item = document.createElement('div');
        item.className = `border ${ans.isCorrect ? 'border-correct/50' : 'border-incorrect/50'} p-16px`;
        
        item.innerHTML = `
          <button class="w-full text-left flex justify-between items-center outline-none" onclick="this.nextElementSibling.classList.toggle('hidden')">
            <div class="flex items-center gap-16px">
              <span class="font-mono text-xs ${ans.isCorrect ? 'text-correct' : 'text-incorrect'}">${ans.isCorrect ? 'PASS' : 'FAIL'}</span>
              <span class="text-sm font-bold truncate max-w-[200px] md:max-w-md">${ans.question.prompt}</span>
            </div>
            <i data-lucide="chevron-down" class="w-4 h-4"></i>
          </button>
          
          <div class="hidden mt-16px pt-16px border-t border-borderLight dark:border-borderDark text-sm space-y-16px">
            <p class="text-mutedLight dark:text-mutedDark">${ans.question.text}</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8px">
              <div class="p-8px border border-incorrect/30 bg-incorrect/5 ${ans.isCorrect ? 'hidden' : ''}">
                <span class="block text-[10px] font-mono text-incorrect uppercase mb-1">Your Answer</span>
                ${ans.question.options[ans.selected]}
              </div>
              <div class="p-8px border border-correct/30 bg-correct/5">
                <span class="block text-[10px] font-mono text-correct uppercase mb-1">Correct Answer</span>
                ${ans.question.options[ans.question.answer]}
              </div>
            </div>
            <div class="bg-borderLight/30 dark:bg-borderDark/30 p-16px border-l-2 border-textLight dark:border-textDark">
              <span class="block text-[10px] font-mono uppercase mb-2">System Explanation</span>
              ${ans.question.explanation}
            </div>
          </div>
        `;
        container.appendChild(item);
      });

      navigate('results');
    }

    // Initialize
    initStats();
    lucide.createIcons();
  </script>
</body>
</html>
